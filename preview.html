<!DOCTYPE html>
<html lang="en">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adrianna & Thomas — Whimsical Bridal Party Hub</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            powder: {
              50: '#f4f8fc',
              100: '#e5f1f9',
              200: '#cfe3f4',
              300: '#a7ceeb',
              400: '#75b1dd',
              500: '#4f94cc',
              600: '#3978af',
              700: '#2f608d',
              800: '#2a5175',
              900: '#264461',
            },
            celestial: {
              50: '#fdfbf7',
              100: '#f9f4e8',
              200: '#f2e7cd',
              300: '#e8d4a6',
              400: '#dab975',
              500: '#c59d4c',
            }
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Playfair Display', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            whimsical: ['"Great Vibes"', 'cursive']
          }
        }
      }
    }
  </script>

  <!-- React 18, ReactDOM & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(ellipse at top, #f4f9fd 0%, #ebf4fb 50%, #e2eff8 100%);
      color: #1e364d;
      min-height: 100vh;
    }
    .font-serif-heading {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }
    .font-whimsical {
      font-family: 'Great Vibes', cursive;
    }
  </style>
</head>
<body class="antialiased selection:bg-powder-200 selection:text-powder-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DEFAULT_BRIDE = {
      id: 'bride-adrianna',
      name: 'Adrianna "Rain" Eskew',
      role: 'The Bride 👰',
      phone: '(555) 123-4567',
      isBride: true,
      isAdmin: true
    };

    const DEFAULT_BRIDESMAIDS = [
      {
        id: 'bm-payton',
        name: 'Payton',
        role: 'Maid of Honor 💎 (Co-Admin)',
        phone: '(555) 789-0123',
        dressStatus: 'Ready',
        dressNotes: 'Show Me Your Mumu Steel Blue Stretch',
        hotelBooked: true,
        hotelRoommate: 'Bridal Suite',
        hotelNights: 'Fri - Sun',
        isBride: false,
        isAdmin: true
      },
      {
        id: 'bm-generic',
        name: 'Jane Doe',
        role: 'Bridesmaid',
        phone: '(555) 000-0000',
        dressStatus: 'Not Ordered',
        dressNotes: 'Order deadline Dec 1st',
        hotelBooked: false,
        hotelRoommate: 'TBD',
        hotelNights: 'Fri - Sun',
        isBride: false,
        isAdmin: false
      }
    ];

    const DEFAULT_WEDDING = {
      bride: 'Adrianna Eskew',
      groom: 'Thomas Albritton',
      dateFormatted: 'Saturday, March 6, 2027',
      timeFormatted: 'Five Thirty in the Afternoon (5:30 PM)',
      venueName: 'The Ceremony & Reception',
      venueAddress: '2008 Middleground Road',
      cityStateZip: 'Waynesboro, GA 30830',
      photoUrl: './couple.jpg',
      invitationUrl: './invitation.jpg',
      quote: 'Two souls, one heartfelt beginning in the pines surrounded by family & friends.'
    };

    const DEFAULT_DRESS_REQUIREMENTS = {
      storeName: 'Show Me Your Mumu',
      colorName: 'Steel Blue Stretch',
      storeUrl: 'https://showmeyourmumu.com/collections/mumu-weddings-steel-blue',
      swatchUrl: 'https://showmeyourmumu.com/products/bridesmaid-fabric-swatch-steel-blue-stretch?variant=33108392673323',
      hexCodes: ['#5b768e', '#7d98ae', '#9cb5c9', '#c4d5e2'],
      fabric: 'Stretch Satin / Steel Blue Stretch (Show Me Your Mumu Collection)',
      orderDeadline: 'December 1, 2026 (allow 8-10 weeks for delivery & alterations)',
      shoes: 'Nude, champagne metallic, or soft blue block heels (lawn-safe for outdoor grounds)',
      jewelryHair: 'Delicate pearl/gold accessories, loose romantic waves or half-up hair with optional black ribbon accent.'
    };

    const DEFAULT_HOTEL = {
      name: 'Waynesboro Area Hotel & Suites Block',
      address: 'Waynesboro / Augusta Area, Georgia',
      rate: '$169 / night (Bridal Party Courtesy Block)',
      cutOffDate: 'January 15, 2027',
      groupCode: 'ESKEWALBRITTON27',
      bookingUrl: 'https://www.google.com/travel',
      shuttleNotes: 'Coordinated shuttle will run between the hotel block and 2008 Middleground Road before ceremony & after reception.'
    };

    const DEFAULT_TASKS = [
      {
        id: 't-1',
        category: 'Attire',
        title: 'Order Show Me Your Mumu "Steel Blue Stretch" dress',
        assignee: 'All Bridesmaids',
        dueDate: 'Dec 1, 2026',
        completed: false
      },
      {
        id: 't-2',
        category: 'Hotel',
        title: 'Reserve room under ESKEWALBRITTON27 group block',
        assignee: 'All Bridesmaids',
        dueDate: 'Jan 15, 2027',
        completed: false
      },
      {
        id: 't-3',
        category: 'Shower',
        title: 'Bridal shower coordination & games',
        assignee: 'Maid of Honor (Payton)',
        dueDate: 'Jan 30, 2027',
        completed: false
      },
      {
        id: 't-4',
        category: 'Day-Of',
        title: 'Arrive at 2008 Middleground Rd for morning hair & makeup',
        assignee: 'All Bridesmaids',
        dueDate: 'March 6, 2027',
        completed: false
      }
    ];

    const DEFAULT_POLLS = [
      {
        id: 'p1',
        title: 'Wedding Morning Brunch & Refreshments 🥐☕',
        description: 'Select what treats you would love while getting hair & makeup done at Middleground Road:',
        isMultiSelect: true,
        allowAddOption: true,
        expiresAt: 'Open for Voting',
        options: [
          { id: 'o1', text: 'Bagels, Whipped Cream Cheese & Fresh Fruit 🥯🍓', voters: ['Jane Doe', 'Payton'] },
          { id: 'o2', text: 'Fresh Berries & Greek Yogurt Parfait Bar 🫐🍯', voters: [] },
          { id: 'o3', text: 'Iced Vanilla Lattes & Cold Brew Bar 🧋✨', voters: ['Jane Doe', 'Payton'] },
          { id: 'o4', text: 'Mimosas & Sparkling Peach Bellinis 🥂🍑', voters: ['Payton'] }
        ]
      },
      {
        id: 'p2',
        title: 'Bridal Party Manicure Preference 💅✨',
        description: 'Vote on your favorite manicure style for wedding weekend:',
        isMultiSelect: false,
        allowAddOption: true,
        expiresAt: 'Open for Voting',
        options: [
          { id: 'o201', text: 'Glazed Donut / Sheer Milky Chrome 🫧', voters: ['Jane Doe', 'Payton'] },
          { id: 'o202', text: 'Soft Steel Blue Accent Nails 🩵', voters: [] },
          { id: 'o203', text: 'Classic French Tip with Micro Sparkle 🕊️', voters: [] }
        ]
      }
    ];

    const DEFAULT_MESSAGES = [
      {
        id: 'msg-1',
        sender: 'Adrianna "Rain" Eskew',
        role: 'The Bride 👰',
        text: 'Welcome to our whimsical wedding hub! 🩵✨ You can check dress requirements for our Show Me Your Mumu Steel Blue dresses, order your fabric swatch, coordinate hotel rooms, and vote in the polls!',
        timestamp: 'Today at 10:00 AM',
        reactions: { '❤️': 2, '🥂': 2, '✨': 3 }
      },
      {
        id: 'msg-2',
        sender: 'Payton',
        role: 'Maid of Honor 💎 (Co-Admin)',
        text: 'So excited for March 6th! 🌲💍 Make sure to order your Show Me Your Mumu Steel Blue swatches ($3) to match accessories!',
        timestamp: 'Today at 10:15 AM',
        reactions: { '❤️': 2, '✨': 2 }
      }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('dresses');
      
      // Data state
      const [brideProfile, setBrideProfile] = useState(() => {
        const saved = localStorage.getItem('bridal_v7_bride');
        return saved ? JSON.parse(saved) : DEFAULT_BRIDE;
      });

      const [bridesmaids, setBridesmaids] = useState(() => {
        const saved = localStorage.getItem('bridal_v7_bridesmaids');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            // Ensure Payton is in the list
            if (!parsed.some(bm => bm.name.toLowerCase().includes('payton'))) {
              return DEFAULT_BRIDESMAIDS;
            }
            return parsed;
          } catch(e) {
            return DEFAULT_BRIDESMAIDS;
          }
        }
        return DEFAULT_BRIDESMAIDS;
      });

      const [weddingDetails, setWeddingDetails] = useState(() => {
        const saved = localStorage.getItem('bridal_v7_wedding');
        return saved ? { ...DEFAULT_WEDDING, ...JSON.parse(saved) } : DEFAULT_WEDDING;
      });

      // Purge any legacy cache of Azazie or Birdy Grey automatically
      const [dressReq, setDressReq] = useState(() => {
        const saved = localStorage.getItem('bridal_v7_dress_req');
        if (!saved) return DEFAULT_DRESS_REQUIREMENTS;
        try {
          const parsed = JSON.parse(saved);
          if (!parsed.storeName || parsed.storeName.toLowerCase().includes('azazie') || parsed.storeName.toLowerCase().includes('birdy')) {
            return DEFAULT_DRESS_REQUIREMENTS;
          }
          return { ...DEFAULT_DRESS_REQUIREMENTS, ...parsed };
        } catch (e) {
          return DEFAULT_DRESS_REQUIREMENTS;
        }
      });

      const [hotel, setHotel] = useState(() => {
        const saved = localStorage.getItem('bridal_v7_hotel');
        return saved ? JSON.parse(saved) : DEFAULT_HOTEL;
      });

      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem('bridal_v7_tasks');
        return saved ? JSON.parse(saved) : DEFAULT_TASKS;
      });

      const [polls, setPolls] = useState(() => {
        const saved = localStorage.getItem('bridal_v7_polls');
        return saved ? JSON.parse(saved) : DEFAULT_POLLS;
      });

      const [messages, setMessages] = useState(() => {
        const saved = localStorage.getItem('bridal_v7_messages');
        return saved ? JSON.parse(saved) : DEFAULT_MESSAGES;
      });

      // Active User Profile: Explicitly required
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('bridal_v7_active_user');
        return saved ? JSON.parse(saved) : DEFAULT_BRIDE;
      });

      // PERMISSION: Both the Bride (Adrianna / Rain) AND Payton have full admin & editing access
      const isAdmin = currentUser && (
        currentUser.isBride === true ||
        currentUser.isAdmin === true ||
        currentUser.role?.toLowerCase().includes('bride') ||
        currentUser.name?.toLowerCase().includes('rain') ||
        currentUser.name?.toLowerCase().includes('adrianna') ||
        currentUser.name?.toLowerCase().includes('payton') ||
        currentUser.role?.toLowerCase().includes('co-admin') ||
        currentUser.role?.toLowerCase().includes('admin')
      );
      const isBride = isAdmin; // Alias for complete backward compatibility

      // Users "rain" and "payton" are exempt from the (edited) indicator
      const isExemptFromEditedIndicator = (userName) => {
        if (!userName) return false;
        const lower = userName.toLowerCase();
        return lower.includes('rain') || lower.includes('payton') || lower.includes('adrianna');
      };

      // Modals
      const [showProfileModal, setShowProfileModal] = useState(false);
      const [profilePromptReason, setProfilePromptReason] = useState('');
      const [showNewMemberForm, setShowNewMemberForm] = useState(false);
      const [newMemberName, setNewMemberName] = useState('');
      const [newMemberRole, setNewMemberRole] = useState('Bridesmaid');
      const [newMemberPhone, setNewMemberPhone] = useState('');

      const [showBridesmaidModal, setShowBridesmaidModal] = useState(null);
      const [showEditWeddingModal, setShowEditWeddingModal] = useState(false);
      const [showEditDressModal, setShowEditDressModal] = useState(false);
      const [showEditHotelModal, setShowEditHotelModal] = useState(false);
      const [showNewPollModal, setShowNewPollModal] = useState(false);
      const [showEditPollModal, setShowEditPollModal] = useState(null);
      const [showNewTaskModal, setShowNewTaskModal] = useState(false);
      const [showEditTaskModal, setShowEditTaskModal] = useState(null);
      const [showPhotoModal, setShowPhotoModal] = useState(false);
      const [showInvitationModal, setShowInvitationModal] = useState(false);

      const [copiedCode, setCopiedCode] = useState(false);
      const [chatInput, setChatInput] = useState('');
      const [editingMessageId, setEditingMessageId] = useState(null);
      const [editingMessageText, setEditingMessageText] = useState('');
      const [pinnedNote, setPinnedNote] = useState(() => {
        return localStorage.getItem('bridal_v7_pinned_note') || '📌 Whimsical Reminder: Order Show Me Your Mumu Steel Blue dresses before Dec 1st & book hotel suites!';
      });
      const [isEditingPinned, setIsEditingPinned] = useState(false);
      const [newPollOptionInputs, setNewPollOptionInputs] = useState({});

      const chatEndRef = useRef(null);

      // Persistence
      useEffect(() => {
        localStorage.setItem('bridal_v7_bride', JSON.stringify(brideProfile));
      }, [brideProfile]);

      useEffect(() => {
        localStorage.setItem('bridal_v7_bridesmaids', JSON.stringify(bridesmaids));
      }, [bridesmaids]);

      useEffect(() => {
        localStorage.setItem('bridal_v7_wedding', JSON.stringify(weddingDetails));
      }, [weddingDetails]);

      useEffect(() => {
        localStorage.setItem('bridal_v7_dress_req', JSON.stringify(dressReq));
      }, [dressReq]);

      useEffect(() => {
        localStorage.setItem('bridal_v7_hotel', JSON.stringify(hotel));
      }, [hotel]);

      useEffect(() => {
        localStorage.setItem('bridal_v7_tasks', JSON.stringify(tasks));
      }, [tasks]);

      useEffect(() => {
        localStorage.setItem('bridal_v7_polls', JSON.stringify(polls));
      }, [polls]);

      useEffect(() => {
        localStorage.setItem('bridal_v7_messages', JSON.stringify(messages));
      }, [messages]);

      useEffect(() => {
        localStorage.setItem('bridal_v7_pinned_note', pinnedNote);
      }, [pinnedNote]);

      useEffect(() => {
        if (currentUser) {
          localStorage.setItem('bridal_v7_active_user', JSON.stringify(currentUser));
        } else {
          localStorage.removeItem('bridal_v7_active_user');
        }
      }, [currentUser]);

      // Scroll chat
      useEffect(() => {
        if (activeTab === 'chat' && chatEndRef.current) {
          chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [messages, activeTab]);

      const allProfiles = [
        { id: brideProfile.id, name: brideProfile.name, role: brideProfile.role, isBride: true, isAdmin: true },
        ...bridesmaids.map(bm => ({ 
          id: bm.id, 
          name: bm.name, 
          role: bm.role, 
          isBride: false, 
          isAdmin: bm.isAdmin || bm.name.toLowerCase().includes('payton') || bm.name.toLowerCase().includes('rain')
        }))
      ];

      const requireUser = (reasonText = 'Please identify who you are in order to continue:') => {
        if (!currentUser) {
          setProfilePromptReason(reasonText);
          setShowProfileModal(true);
          return false;
        }
        return true;
      };

      const handleSelectProfile = (profile) => {
        setCurrentUser(profile);
        setShowProfileModal(false);
        setProfilePromptReason('');
      };

      const handleCreateNewMemberProfile = (e) => {
        e.preventDefault();
        if (!newMemberName.trim()) return;
        const isPaytonOrRain = newMemberName.trim().toLowerCase().includes('payton') || newMemberName.trim().toLowerCase().includes('rain');
        const newBm = {
          id: 'bm-' + Date.now(),
          name: newMemberName.trim(),
          role: newMemberRole.trim() || (isPaytonOrRain ? 'Co-Admin' : 'Bridesmaid'),
          phone: newMemberPhone.trim() || '(555) 000-0000',
          dressStatus: 'Not Ordered',
          dressNotes: '',
          hotelBooked: false,
          hotelRoommate: 'TBD',
          hotelNights: 'Fri - Sun',
          isBride: false,
          isAdmin: isPaytonOrRain
        };
        const updated = [...bridesmaids, newBm];
        setBridesmaids(updated);
        setCurrentUser({ id: newBm.id, name: newBm.name, role: newBm.role, isBride: false, isAdmin: isPaytonOrRain });
        setNewMemberName('');
        setNewMemberRole('Bridesmaid');
        setNewMemberPhone('');
        setShowNewMemberForm(false);
        setShowProfileModal(false);
      };

      // Voting Logic
      const handleVote = (pollId, optionId) => {
        if (!requireUser('✨ Please tell us who you are before voting in the poll!')) {
          return;
        }

        const voterName = currentUser.name;

        setPolls(prevPolls => prevPolls.map(poll => {
          if (poll.id !== pollId) return poll;

          if (poll.isMultiSelect) {
            const updatedOptions = poll.options.map(opt => {
              if (opt.id === optionId) {
                const alreadyVoted = opt.voters.includes(voterName);
                const nextVoters = alreadyVoted
                  ? opt.voters.filter(v => v !== voterName)
                  : [...opt.voters, voterName];
                return { ...opt, voters: nextVoters };
              }
              return opt;
            });
            return { ...poll, options: updatedOptions };
          } else {
            const wasSelected = poll.options.find(o => o.id === optionId)?.voters.includes(voterName);
            const updatedOptions = poll.options.map(opt => {
              const cleanedVoters = opt.voters.filter(v => v !== voterName);
              if (opt.id === optionId && !wasSelected) {
                return { ...opt, voters: [...cleanedVoters, voterName] };
              }
              return { ...opt, voters: cleanedVoters };
            });
            return { ...poll, options: updatedOptions };
          }
        }));
      };

      const handleAddPollOption = (pollId) => {
        if (!requireUser('✨ Please select your profile to suggest a poll option!')) {
          return;
        }
        const text = (newPollOptionInputs[pollId] || '').trim();
        if (!text) return;

        setPolls(prevPolls => prevPolls.map(poll => {
          if (poll.id !== pollId) return poll;
          const newOpt = {
            id: 'opt-' + Date.now(),
            text: text,
            voters: [currentUser.name]
          };
          return {
            ...poll,
            options: [...poll.options, newOpt]
          };
        }));

        setNewPollOptionInputs(prev => ({ ...prev, [pollId]: '' }));
      };

      const handleDeletePoll = (pollId) => {
        if (!isAdmin) return;
        if (confirm('Delete this poll?')) {
          setPolls(prev => prev.filter(p => p.id !== pollId));
        }
      };

      // Chat
      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!chatInput.trim()) return;

        if (!requireUser('✨ Please select your profile to send a chat message:')) {
          return;
        }

        const newMsg = {
          id: 'msg-' + Date.now(),
          sender: currentUser.name,
          role: currentUser.role,
          text: chatInput.trim(),
          timestamp: 'Just now',
          reactions: {}
        };

        setMessages(prev => [...prev, newMsg]);
        setChatInput('');
      };

      const handleAddReaction = (msgId, emoji) => {
        if (!requireUser('✨ Select your profile to react to messages!')) {
          return;
        }
        setMessages(prev => prev.map(m => {
          if (m.id !== msgId) return m;
          const currentCount = m.reactions?.[emoji] || 0;
          return {
            ...m,
            reactions: {
              ...m.reactions,
              [emoji]: currentCount + 1
            }
          };
        }));
      };

      const handleDeleteMessage = (msgId) => {
        if (!isAdmin) return;
        if (confirm('Delete this message?')) {
          setMessages(prev => prev.filter(m => m.id !== msgId));
        }
      };

      // Message Editing (Available to message sender & admins; indicates edited except for Rain and Payton)
      const handleStartEditMessage = (msg) => {
        if (!requireUser('✨ Please select your profile to edit messages:')) return;
        setEditingMessageId(msg.id);
        setEditingMessageText(msg.text);
      };

      const handleCancelEditMessage = () => {
        setEditingMessageId(null);
        setEditingMessageText('');
      };

      const handleSaveEditMessage = (msgId) => {
        if (!editingMessageText.trim()) return;

        const currentUserName = currentUser?.name || '';
        const isExempt = isExemptFromEditedIndicator(currentUserName);

        setMessages(prev => prev.map(m => {
          if (m.id !== msgId) return m;
          return {
            ...m,
            text: editingMessageText.trim(),
            // Only flag as edited if NOT rain or payton!
            isEdited: !isExempt,
            editedBy: currentUserName,
            editedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          };
        }));

        setEditingMessageId(null);
        setEditingMessageText('');
      };

      const handleCopyCode = () => {
        navigator.clipboard.writeText(hotel.groupCode || '');
        setCopiedCode(true);
        setTimeout(() => setCopiedCode(false), 2200);
      };

      const handleToggleTask = (taskId) => {
        setTasks(prev => prev.map(t => t.id === taskId ? { ...t, completed: !t.completed } : t));
      };

      const handleDeleteTask = (taskId, e) => {
        e.stopPropagation();
        if (!isAdmin) return;
        if (confirm('Delete this checklist task?')) {
          setTasks(prev => prev.filter(t => t.id !== taskId));
        }
      };

      // Photo upload (Restricted to Bride & Payton)
      const handlePhotoUpload = (e) => {
        if (!isAdmin) {
          alert("Only the Bride (Adrianna) and Payton have permission to edit the wedding photo.");
          return;
        }
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setWeddingDetails(prev => ({ ...prev, photoUrl: reader.result }));
          };
          reader.readAsDataURL(file);
        }
      };

      // Invitation upload (Restricted to Bride & Payton)
      const handleInvitationUpload = (e) => {
        if (!isAdmin) {
          alert("Only the Bride (Adrianna) and Payton have permission to edit the invitation.");
          return;
        }
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setWeddingDetails(prev => ({ ...prev, invitationUrl: reader.result }));
          };
          reader.readAsDataURL(file);
        }
      };

      return (
        /* WIDE-SCREEN RESPONSIVE CONTAINER: Utilizes the entire screen beautifully */
        <div className="w-full max-w-6xl mx-auto min-h-screen px-4 sm:px-6 lg:px-8 pt-4 pb-24">
          
          {/* Top Profile Banner & Identification Ribbon (Full Width) */}
          <header className="mb-6 bg-white/85 backdrop-blur-md border border-powder-200/90 rounded-2xl p-3 sm:px-5 shadow-sm flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-powder-400 to-powder-200 flex items-center justify-center text-lg shadow-xs text-white flex-shrink-0">
                {currentUser ? (currentUser.isBride ? '👰' : currentUser.name?.toLowerCase().includes('payton') ? '💎' : '🩵') : '✨'}
              </div>
              <div>
                <div className="text-[11px] font-semibold tracking-wider uppercase text-powder-600 flex items-center gap-1.5">
                  <span>Profile</span>
                  <span className="w-2 h-2 rounded-full bg-emerald-400 inline-block"></span>

            <div className="fixed inset-0 z-50 bg-powder-950/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-powder-200 space-y-3.5 animate-in fade-in zoom-in-95 duration-200 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-bold font-serif-heading text-powder-900">
                    Edit Hotel Block (Bride & Payton)
                  </h3>
                  <button onClick={() => setShowEditHotelModal(false)} className="text-powder-400 hover:text-powder-700 text-base">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  setHotel({
                    name: form.name.value,
                    address: form.address.value,
                    groupCode: form.groupCode.value,
                    cutOffDate: form.cutOffDate.value,
                    rate: form.rate.value,
                    bookingUrl: form.bookingUrl.value,
                    shuttleNotes: form.shuttleNotes.value
                  });
                  setShowEditHotelModal(false);
                }} className="space-y-3 text-xs sm:text-sm">
                  <div>
                    <label className="text-[10px] uppercase font-semibold text-powder-700">Hotel Name</label>
                    <input name="name" defaultValue={hotel.name} className="w-full px-3 py-2 rounded-xl border border-powder-200 bg-white" />
                  </div>
                  <div>
                    <label className="text-[10px] uppercase font-semibold text-powder-700">Address</label>
                    <input name="address" defaultValue={hotel.address} className="w-full px-3 py-2 rounded-xl border border-powder-200 bg-white" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[10px] uppercase font-semibold text-powder-700">Group Code</label>
                      <input name="groupCode" defaultValue={hotel.groupCode} className="w-full px-3 py-2 rounded-xl border border-powder-200 bg-white" />
                    </div>
                    <div>
                      <label className="text-[10px] uppercase font-semibold text-powder-700">Nightly Rate</label>
                      <input name="rate" defaultValue={hotel.rate} className="w-full px-3 py-2 rounded-xl border border-powder-200 bg-white" />
                    </div>
                  </div>
                  <div>
                    <label className="text-[10px] uppercase font-semibold text-powder-700">Cut-Off Deadline Date</label>
                    <input name="cutOffDate" defaultValue={hotel.cutOffDate} className="w-full px-3 py-2 rounded-xl border border-powder-200 bg-white" />
                  </div>
                  <div>
                    <label className="text-[10px] uppercase font-semibold text-powder-700">Shuttle & Transportation Notes</label>
                    <textarea name="shuttleNotes" defaultValue={hotel.shuttleNotes} rows="2" className="w-full px-3 py-2 rounded-xl border border-powder-200 bg-white" />
                  </div>
                  <div>
                    <label className="text-[10px] uppercase font-semibold text-powder-700">Direct Booking URL</label>
                    <input name="bookingUrl" defaultValue={hotel.bookingUrl} className="w-full px-3 py-2 rounded-xl border border-powder-200 bg-white" />
                  </div>

                  <button
                    type="submit"
                    className="w-full py-2.5 bg-powder-500 hover:bg-powder-600 text-white font-semibold rounded-2xl shadow-xs"
                  >
                    Save Hotel Info
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* =========================================================================
              MODAL 7: CREATE NEW POLL
             ========================================================================= */}
          {showNewPollModal && (
            <div className="fixed inset-0 z-50 bg-powder-950/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-powder-200 space-y-3.5 animate-in fade-in zoom-in-95 duration-200">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-bold font-serif-heading text-powder-900">
                    Create Bridal Poll 📊
                  </h3>
                  <button onClick={() => setShowNewPollModal(false)} className="text-powder-400 hover:text-powder-700 text-base">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  const rawOptions = form.options.value.split('\n').filter(o => o.trim());
                  const newPoll = {
                    id: 'p-' + Date.now(),
                    title: form.title.value.trim(),
                    description: form.description.value.trim(),
                    isMultiSelect: form.isMultiSelect.checked,
                    allowAddOption: true,
                    expiresAt: 'Open for Voting',
                    options: rawOptions.map((text, idx) => ({
                      id: 'opt-' + Date.now() + '-' + idx,
                      text: text.trim(),
                      voters: []
                    }))
                  };
                  setPolls([...polls, newPoll]);
                  setShowNewPollModal(false);
                }} className="space-y-3 text-xs sm:text-sm">
                  <div>
                    <label className="text-[10px] uppercase font-semibold text-powder-700">Poll Question / Title</label>
                    <input name="title" required placeholder="e.g. Bridesmaid Bouquets Style 💐" className="w-full px-3 py-2 rounded-xl border border-powder-200 bg-white" />
                  </div>

                  <div>
                    <label className="text-[10px] uppercase font-semibold text-powder-700">Short Note / Description</label>
                    <input name="description" placeholder="Brief explanation..." className="w-full px-3 py-2 rounded-xl border border-powder-200 bg-white" />
                  </div>

                  <div>
                    <label className="text-[10px] uppercase font-semibold text-powder-700">Options (one per line)</label>
                    <textarea
                      name="options"
                      required
                      rows="3"
                      placeholder="Option 1&#10;Option 2&#10;Option 3"
                      className="w-full px-3 py-2 rounded-xl border border-powder-200 bg-white"
                    />
                  </div>

                  <div className="flex items-center gap-2 pt-1">
                    <input type="checkbox" name="isMultiSelect" id="multiSelect" className="w-4 h-4 rounded text-powder-600 focus:ring-powder-400" />
                    <label htmlFor="multiSelect" className="text-xs text-powder-800 font-medium">Allow bridesmaids to select multiple options</label>
                  </div>

                  <button
                    type="submit"
                    className="w-full py-2.5 bg-powder-500 hover:bg-powder-600 text-white font-semibold rounded-2xl shadow-xs mt-2"
                  >
                    Publish Poll
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* =========================================================================
              MODAL: EDIT BRIDAL POLL (EDITABLE BY BRIDE & PAYTON)
             ========================================================================= */}
          {showEditPollModal && isAdmin && (
            <div className="fixed inset-0 z-50 bg-powder-950/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-powder-200 space-y-3.5 animate-in fade-in zoom-in-95 duration-200 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-bold font-serif-heading text-powder-900">
                    Edit Bridal Poll 📊
                  </h3>
                  <button onClick={() => setShowEditPollModal(null)} className="text-powder-400 hover:text-powder-700 text-base">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  const rawOptions = form.optionsText.value.split('\n').filter(o => o.trim());
                  
                  // Preserve existing voter tallies for options with identical text
                  const updatedOptions = rawOptions.map((text, idx) => {
                    const trimmed = text.trim();
                    const existing = showEditPollModal.options.find(o => o.text.trim() === trimmed);
                    return {
                      id: existing ? existing.id : ('opt-' + Date.now() + '-' + idx),
                      text: trimmed,
                      voters: existing ? existing.voters : []
                    };
                  });

                  setPolls(prev => prev.map(p => p.id === showEditPollModal.id ? {
                    ...p,
                    title: form.title.value.trim(),
                    description: form.description.value.trim(),
                    isMultiSelect: form.isMultiSelect.checked,
                    expiresAt: form.expiresAt.value.trim() || 'Open for Voting',
                    options: updatedOptions
                  } : p));

                  setShowEditPollModal(null);
                }} className="space-y-3 text-xs sm:text-sm">
                  <div>
                    <label className="text-[10px] uppercase font-semibold text-powder-700">Poll Question / Title</label>
                    <input name="title" defaultValue={showEditPollModal.title} required className="w-full px-3 py-2 rounded-xl border border-powder-200 bg-white" />
                  </div>

                  <div>
                    <label className="text-[10px] uppercase font-semibold text-powder-700">Short Note / Description</label>
                    <input name="description" defaultValue={showEditPollModal.description} className="w-full px-3 py-2 rounded-xl border border-powder-200 bg-white" />
                  </div>

                  <div>
                    <label className="text-[10px] uppercase font-semibold text-powder-700">Voting Status</label>
                    <input name="expiresAt" defaultValue={showEditPollModal.expiresAt} className="w-full px-3 py-2 rounded-xl border border-powder-200 bg-white" />
                  </div>

                  <div>
                    <label className="text-[10px] uppercase font-semibold text-powder-700">Options (one per line)</label>
                    <textarea
                      name="optionsText"
                      required
                      rows="4"
                      defaultValue={showEditPollModal.options.map(o => o.text).join('\n')}
                      className="w-full px-3 py-2 rounded-xl border border-powder-200 bg-white leading-relaxed"
                    />
                    <span className="text-[10px] text-powder-500">Edit option text or add new lines. Existing votes on unchanged lines will be preserved.</span>
                  </div>

                  <div className="flex items-center gap-2 pt-1">
                    <input type="checkbox" name="isMultiSelect" id="editMultiSelect" defaultChecked={showEditPollModal.isMultiSelect} className="w-4 h-4 rounded text-powder-600 focus:ring-powder-400" />
                    <label htmlFor="editMultiSelect" className="text-xs text-powder-800 font-medium">Allow bridesmaids to select multiple options</label>
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button
                      type="submit"
                      className="flex-1 py-2.5 bg-powder-500 hover:bg-powder-600 text-white font-semibold rounded-2xl shadow-xs"
                    >
                      Save Changes
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        setPolls(prev => prev.filter(p => p.id !== showEditPollModal.id));
                        setShowEditPollModal(null);
                      }}
                      className="px-3.5 py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-700 font-semibold rounded-2xl border border-rose-200 shadow-2xs"
                    >
                      Delete Poll
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* =========================================================================
              MODAL 8: CREATE NEW TASK (EDITABLE BY BRIDE & PAYTON)
             ========================================================================= */}
          {showNewTaskModal && isAdmin && (
            <div className="fixed inset-0 z-50 bg-powder-950/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-powder-200 space-y-3.5 animate-in fade-in zoom-in-95 duration-200">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-bold font-serif-heading text-powder-900">
                    Add Checklist Task 📋
                  </h3>
                  <button onClick={() => setShowNewTaskModal(false)} className="text-powder-400 hover:text-powder-700 text-base">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  const newTask = {
                    id: 't-' + Date.now(),
                    title: form.title.value.trim(),
                    category: form.category.value,
                    assignee: form.assignee.value.trim() || 'All Bridesmaids',
                    dueDate: form.dueDate.value.trim() || 'TBD',
                    completed: false
                  };
                  setTasks([...tasks, newTask]);
                  setShowNewTaskModal(false);
                }} className="space-y-3 text-xs sm:text-sm">
                  <div>
                    <label className="text-[10px] uppercase font-semibold text-powder-700">Task Title</label>
                    <input name="title" required className="w-full px-3 py-2 rounded-xl border border-powder-200 bg-white" />
                  </div>
                  <div>
                    <label className="text-[10px] uppercase font-semibold text-powder-700">Category</label>
                    <select name="category" className="w-full px-3 py-2 rounded-xl border border-powder-200 bg-white">
                      <option value="Attire">Attire</option>
                      <option value="Hotel">Hotel</option>
                      <option value="Shower">Shower</option>
                      <option value="Rehearsal">Rehearsal</option>
                      <option value="Day-Of">Day-Of</option>
                    </select>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[10px] uppercase font-semibold text-powder-700">Assignee</label>
                      <input name="assignee" defaultValue="All Bridesmaids" className="w-full px-3 py-2 rounded-xl border border-powder-200 bg-white" />
                    </div>
                    <div>
                      <label className="text-[10px] uppercase font-semibold text-powder-700">Due Date</label>
                      <input name="dueDate" placeholder="e.g. Dec 1" className="w-full px-3 py-2 rounded-xl border border-powder-200 bg-white" />
                    </div>
                  </div>

                  <button
                    type="submit"
                    className="w-full py-2.5 bg-powder-500 hover:bg-powder-600 text-white font-semibold rounded-2xl shadow-xs mt-2"
                  >
                    Add Task
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* =========================================================================
              MODAL 9: EDIT CHECKLIST TASK (EDITABLE BY BRIDE & PAYTON)
             ========================================================================= */}
          {showEditTaskModal && isAdmin && (
            <div className="fixed inset-0 z-50 bg-powder-950/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-powder-200 space-y-3.5 animate-in fade-in zoom-in-95 duration-200">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-bold font-serif-heading text-powder-900">
                    Edit Checklist Task 📋
                  </h3>
                  <button onClick={() => setShowEditTaskModal(null)} className="text-powder-400 hover:text-powder-700 text-base">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  setTasks(prev => prev.map(t => t.id === showEditTaskModal.id ? {
                    ...t,
                    title: form.title.value.trim(),
                    category: form.category.value,
                    assignee: form.assignee.value.trim() || 'All Bridesmaids',
                    dueDate: form.dueDate.value.trim() || 'TBD',
                    completed: form.completed.checked
                  } : t));
                  setShowEditTaskModal(null);
                }} className="space-y-3 text-xs sm:text-sm">
                  <div>
                    <label className="text-[10px] uppercase font-semibold text-powder-700">Task Title</label>
                    <input name="title" defaultValue={showEditTaskModal.title} required className="w-full px-3 py-2 rounded-xl border border-powder-200 bg-white" />
                  </div>
                  <div>
                    <label className="text-[10px] uppercase font-semibold text-powder-700">Category</label>
                    <select name="category" defaultValue={showEditTaskModal.category} className="w-full px-3 py-2 rounded-xl border border-powder-200 bg-white">
                      <option value="Attire">Attire</option>
                      <option value="Hotel">Hotel</option>
                      <option value="Shower">Shower</option>
                      <option value="Rehearsal">Rehearsal</option>
                      <option value="Day-Of">Day-Of</option>
                    </select>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[10px] uppercase font-semibold text-powder-700">Assignee</label>
                      <input name="assignee" defaultValue={showEditTaskModal.assignee} className="w-full px-3 py-2 rounded-xl border border-powder-200 bg-white" />
                    </div>
                    <div>
                      <label className="text-[10px] uppercase font-semibold text-powder-700">Due Date</label>
                      <input name="dueDate" defaultValue={showEditTaskModal.dueDate} placeholder="e.g. Dec 1" className="w-full px-3 py-2 rounded-xl border border-powder-200 bg-white" />
                    </div>
                  </div>

                  <div className="flex items-center gap-2 pt-1">
                    <input type="checkbox" name="completed" id="taskCompleted" defaultChecked={showEditTaskModal.completed} className="w-4 h-4 rounded text-powder-600 focus:ring-powder-400" />
                    <label htmlFor="taskCompleted" className="text-xs text-powder-800 font-medium">Mark as completed</label>
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button
                      type="submit"
                      className="flex-1 py-2.5 bg-powder-500 hover:bg-powder-600 text-white font-semibold rounded-2xl shadow-xs"
                    >
                      Save Changes
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        setTasks(prev => prev.filter(t => t.id !== showEditTaskModal.id));
                        setShowEditTaskModal(null);
                      }}
                      className="px-3.5 py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-700 font-semibold rounded-2xl border border-rose-200 shadow-2xs"
                    >
                      Delete Task
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
